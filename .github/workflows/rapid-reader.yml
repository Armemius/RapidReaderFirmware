name: RapidReader firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-rapid-reader-${{ hashFiles('platformio.ini', 'boards/**', 'tools/pio_*.py') }}
      - name: Install build tools
        run: pip install 'platformio>=6.1.19' freetype-py==2.5.1 fonttools==4.68.0
      - name: Check embedded translations
        run: |
          python localization/generate_localization.py --check
          python tools/generate_rapid_ui_font.py --check
      - name: Test product language, settings and navigation
        run: pio test -e native_rapid_reader_test
      - name: Build and package Rev2 firmware
        run: python tools/package_rapid_reader.py
      - uses: actions/upload-artifact@v7
        with:
          name: rapid-reader-0.1.0-esp32-s3-touch-lcd-3.49-rev2
          path: build/rapid-reader-0.1.0/
          if-no-files-found: error
